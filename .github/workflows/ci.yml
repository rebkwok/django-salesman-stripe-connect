name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # (Django 6 uses the django-salesman fork set in pyproject.toml's
          # tool.uv.sources, as django-salesman 1.3.0 requires Django < 6)
          - python: "3.12"
            django: "Django>=5.2,<5.3"
          - python: "3.13"
            django: "Django>=6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run the tests (100% coverage)
        run: uv run --python ${{ matrix.python }} --with "${{ matrix.django }}" pytest
