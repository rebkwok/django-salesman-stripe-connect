[project]
name = "django-salesman-stripe-connect"
version = "0.1.0"
description = "Stripe Checkout payments for django-salesman, as direct charges on a Stripe Connect account"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Becky Smith", email = "rebkwok@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Django>=5.2",
    "django-salesman>=1.3",
    # (the code uses Stripe API version 2026-09-30.endive, which is stripe 16's)
    "stripe>=16,<17",
]

[project.urls]
Repository = "https://github.com/rebkwok/django-salesman-stripe-connect"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["salesman_stripe_connect"]

[tool.hatch.build.targets.sdist]
include = ["salesman_stripe_connect", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "model-bakery>=1.20",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "pytest-freezer>=0.4",
    "requests-mock>=1.12",
]

[tool.uv.sources]
# django-salesman 1.3.0 on PyPI requires Django < 6; this fork only widens that
django-salesman = { git = "https://github.com/rebkwok/django-salesman.git", rev = "12a6cdb0d36bbd544590c151aa2e0422fb72489e" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["salesman_stripe_connect"]
branch = false

[tool.coverage.report]
fail_under = 100
